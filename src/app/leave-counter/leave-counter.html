<p>Jours posés : {{ daysTaken() }}</p>
<!-- aria-live : le lecteur d'ecran annonce le nouveau solde. -->
<p aria-live="polite" [class.counter--empty]="isEmpty()">
  Jours restants : {{ remainingDays() }} / {{ totalDays }}
</p>
<!-- Le symbole @ indique qu'il s'agit d'une syntaxe propre à Angular (un bloc de contrôle) -->
<!-- on ne met pas d'arobase pour appeler une fonction dans un template Angular. Le symbole @ est réservé uniquement aux blocs de contrôle natifs du nouveau moteur (comme @if, @for, @switch).
Pour appeler une fonction ou afficher une variable, on utilise l'interpolation avec des doubles accolades (par exemple {{ maFonction() }}) ou une liaison d'événement/propriété (par exemple (click)="maFonction()"), sans aucun arobase. -->

<p>Vous avez utilisé {{ usedPercent() }} % de vos congés</p>

<p>Vous avez posé : {{ fiveDays() }} jours</p>

@if (remainingDays() < 5) {
  <p>Vous n'avez pas assez de jours pour poser une semaine</p>
}

<button type="button" [disabled]="isEmpty()" (click)="addDay()">Poser un jour</button>
<button type="button" [disabled]="daysTaken() === 0" (click)="removeDay()">Annuler un jour</button>
<button type="button" (click)="reset()">Remettre à zéro</button>
<button type="button" (click)="holiday()">Poser une semaine</button>
